[package]
name = "sutra-cli"
version = "1.0.0"
edition = "2021"
authors = ["Team Overclocked <overclocked@sutra.edu>"]
description = "SUTRA: Student Success and Intervention Orchestration Engine Command-Line Interface"

[[bin]]
name = "sutra"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
uuid = { version = "1.8", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
