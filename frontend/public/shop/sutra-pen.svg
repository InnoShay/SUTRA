<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="barrelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#143A29"/>
      <stop offset="35%" stop-color="#245A42"/>
      <stop offset="70%" stop-color="#1B4734"/>
      <stop offset="100%" stop-color="#0E281C"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="penDrop" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="12" dy="20" stdDeviation="20" flood-color="#071b12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="320" cy="650" rx="140" ry="24" fill="url(#shadow)"/>

  <!-- Precision Pen Body (Diagonal / Center Presentation) -->
  <g transform="translate(300, 360) rotate(-15)" filter="url(#penDrop)">
    <!-- Top Finial & Clip -->
    <rect x="-18" y="-280" width="36" height="24" rx="4" fill="url(#brassGrad)"/>
    <rect x="-16" y="-256" width="32" height="120" rx="3" fill="url(#barrelGrad)"/>
    
    <!-- Machined Pocket Clip -->
    <path d="M 12,-270 L 16,-270 L 22,-140 Q 22,-110 14,-110 L 12,-110 Z" fill="url(#brassGrad)"/>
    
    <!-- Center Band Ring -->
    <rect x="-19" y="-136" width="38" height="12" rx="2" fill="url(#brassGrad)"/>

    <!-- Main Barrel -->
    <rect x="-16" y="-124" width="32" height="280" rx="2" fill="url(#barrelGrad)"/>

    <!-- Knurled Grip Section -->
    <rect x="-15.5" y="156" width="31" height="70" fill="#113324" stroke="url(#brassGrad)" stroke-width="0.8"/>
    <!-- Knurl Hatching -->
    <line x1="-15" y1="165" x2="15" y2="165" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="-15" y1="180" x2="15" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="-15" y1="195" x2="15" y2="195" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="-15" y1="210" x2="15" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

    <!-- Cone Nose & Tungsten Point -->
    <path d="M -15,226 L 15,226 L 5,280 L -5,280 Z" fill="url(#brassGrad)"/>
    <path d="M -3,280 L 3,280 L 0,296 Z" fill="#4B5563"/>

    <!-- LASER-ENGRAVED SUTRA WORDMARK (Rotated along barrel) -->
    <g transform="translate(0, 10) rotate(90)">
      <text x="0" y="5" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="20" fill="#E4EDE3" letter-spacing="6" text-anchor="middle">SUTRA</text>
      <circle cx="58" cy="1" r="3.5" fill="#A3E635"/>
      <text x="0" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="7" fill="#8FAF91" letter-spacing="3" text-anchor="middle">PRECISION ROLLER • 0.5MM</text>
    </g>
  </g>

  <!-- Editorial Packaging Sleeve in Background -->
  <g transform="translate(110, 140)">
    <rect x="0" y="0" width="85" height="420" rx="6" fill="#EDE9DF" stroke="#D5CFC0" stroke-width="1.5" opacity="0.85"/>
    <text x="42" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#153D30" text-anchor="middle" letter-spacing="2">SUTRA</text>
    <text x="42" y="55" font-family="'Inter', sans-serif" font-weight="600" font-size="6.5" fill="#667168" text-anchor="middle">SUPPLY CO.</text>
    <line x1="20" y1="70" x2="65" y2="70" stroke="#153D30" stroke-width="1"/>
  </g>
</svg>
