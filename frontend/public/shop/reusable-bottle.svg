<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#143929"/>
      <stop offset="40%" stop-color="#235A42"/>
      <stop offset="80%" stop-color="#174431"/>
      <stop offset="100%" stop-color="#0E291D"/>
    </linearGradient>
    <linearGradient id="bambooLid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C29A6B"/>
      <stop offset="50%" stop-color="#DFC099"/>
      <stop offset="100%" stop-color="#A57D4F"/>
    </linearGradient>
    <filter id="bottleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#071b12" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="650" rx="160" ry="26" fill="url(#shadow)"/>

  <!-- Bottle Group -->
  <g filter="url(#bottleDrop)">
    <!-- Stainless Steel Carry Loop Handle -->
    <path d="M 270,110 C 270,70 330,70 330,110" fill="none" stroke="#D1D5DB" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Bamboo Cap -->
    <rect x="250" y="105" width="100" height="42" rx="8" fill="url(#bambooLid)" stroke="#8A643B" stroke-width="1.5"/>
    <rect x="254" y="147" width="92" height="12" fill="#E5E7EB"/>

    <!-- Bottle Neck -->
    <path d="M 265,159 L 335,159 L 350,210 Q 380,240 380,270 L 380,600 Q 300,615 220,600 L 220,270 Q 220,240 250,210 Z" fill="url(#bottleGrad)" stroke="#235A42" stroke-width="1.5"/>

    <!-- Stainless Steel Bottom Base Ring -->
    <path d="M 220,590 L 380,590 L 380,610 Q 300,622 220,610 Z" fill="#9CA3AF" stroke="#6B7280" stroke-width="1"/>

    <!-- PROMINENT LASER-ETCHED SUTRA VERTICAL LOGO -->
    <g transform="translate(300, 420) rotate(-90)">
      <!-- SUTRA Brand Name in Clean Silver/Etch -->
      <text x="0" y="12" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="34" fill="#F3F4F6" letter-spacing="8" text-anchor="middle">SUTRA</text>
      
      <!-- Lime Accent Dot -->
      <circle cx="88" cy="4" r="5" fill="#A3E635"/>

      <!-- Specs Subtext -->
      <text x="0" y="32" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#A7F3D0" letter-spacing="4" text-anchor="middle">VACUUM INSULATED • 750 ML</text>
    </g>

    <!-- Powder Coat Specular Highlight Curve -->
    <path d="M 245,260 L 245,580" stroke="rgba(255,255,255,0.18)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
