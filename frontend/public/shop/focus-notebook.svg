<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.22)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4231"/>
      <stop offset="70%" stop-color="#133326"/>
      <stop offset="100%" stop-color="#0C241A"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="bookDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="22" stdDeviation="24" flood-color="#081e14" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="320" cy="650" rx="200" ry="30" fill="url(#shadow)"/>

  <!-- Page Thickness Behind -->
  <path d="M 148,118 L 438,118 L 448,608 L 158,608 Z" fill="#FBF8F1" stroke="#E2DEC9" stroke-width="1.5" filter="url(#bookDrop)"/>
  <path d="M 438,118 L 448,124 L 448,614 L 438,608 Z" fill="#ECE7D3"/>

  <!-- Main Hardcover -->
  <rect x="140" y="110" width="298" height="498" rx="8" fill="url(#coverGrad)" filter="url(#bookDrop)"/>
  
  <!-- Spine Texture Ridge -->
  <rect x="140" y="110" width="22" height="498" rx="4" fill="#0E281C" opacity="0.6"/>
  <line x1="162" y1="110" x2="162" y2="608" stroke="#255842" stroke-width="1.5"/>

  <!-- Ribbon Marker Peeking Out -->
  <path d="M 290,600 Q 285,670 310,690 L 320,680 L 325,695 Q 300,670 305,600 Z" fill="#A3E635"/>
  <path d="M 320,600 Q 330,660 350,675 L 360,668 L 362,680 Q 340,660 332,600 Z" fill="#E4EDE3"/>

  <!-- PROMINENT FOIL SUTRA EMBOSSING -->
  <g transform="translate(295, 330)">
    <!-- Blind-Debossed Border Frame -->
    <rect x="-95" y="-120" width="190" height="240" rx="10" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.85"/>
    
    <!-- Central SUTRA Leaf Crest in Gold Foil -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="28" fill="#0D2619" stroke="url(#goldFoil)" stroke-width="2"/>
      <path d="M 0,-20 L 4,-6 L 18,0 L 4,6 L 0,20 L -4,6 L -18,0 L -4,-6 Z" fill="url(#goldFoil)"/>
    </g>

    <!-- Bold Embossed SUTRA Typography -->
    <text x="0" y="12" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="34" fill="url(#goldFoil)" letter-spacing="6" text-anchor="middle">SUTRA</text>
    
    <!-- Dot accent -->
    <circle cx="75" cy="8" r="4" fill="#A3E635"/>

    <!-- Subtitles -->
    <text x="0" y="38" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#E4EDE3" letter-spacing="4" text-anchor="middle">FOCUS NOTEBOOK</text>
    
    <text x="0" y="58" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#8FAF91" letter-spacing="2" text-anchor="middle">160 PAGES • 120 GSM ACID-FREE</text>
    <text x="0" y="74" font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#8FAF91" letter-spacing="2" text-anchor="middle">SMYTH-SEWN LAY FLAT</text>
  </g>

  <!-- Elastic Band detail -->
  <rect x="400" y="110" width="16" height="498" fill="#0B2117" opacity="0.9"/>
</svg>
