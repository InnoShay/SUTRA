<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="pinDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="18" stdDeviation="18" flood-color="#071b12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="650" rx="220" ry="32" fill="url(#shadow)"/>

  <!-- Woven Green Lanyard Ribbon Loops -->
  <g fill="none" stroke="#163929" stroke-width="48" stroke-linecap="round">
    <path d="M 160,80 Q 200,320 280,480"/>
    <path d="M 440,80 Q 400,320 320,480"/>
  </g>
  <!-- Woven Texture Pattern & Repeating SUTRA text along lanyard -->
  <g fill="none" stroke="#1F4D38" stroke-width="42" stroke-linecap="round">
    <path d="M 160,80 Q 200,320 280,480"/>
    <path d="M 440,80 Q 400,320 320,480"/>
  </g>
  <text x="180" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#A3E635" letter-spacing="4" transform="rotate(70 180 240)">SUTRA • SUTRA</text>
  <text x="420" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#A3E635" letter-spacing="4" transform="rotate(-70 420 240)">SUTRA • SUTRA</text>

  <!-- Metal Swivel Clasp -->
  <g transform="translate(300, 480)" filter="url(#pinDrop)">
    <rect x="-16" y="0" width="32" height="40" rx="4" fill="url(#brassGrad)"/>
    <circle cx="0" cy="46" r="16" fill="none" stroke="url(#brassGrad)" stroke-width="7"/>
    <path d="M -10,60 L 10,60 L 0,84 Z" fill="url(#brassGrad)"/>
  </g>

  <!-- FOREGROUND: LARGE DIE-STRUCK ENAMEL LAPEL PIN -->
  <g transform="translate(300, 340)" filter="url(#pinDrop)">
    <!-- Outer Polished Brass Rim -->
    <circle cx="0" cy="0" r="105" fill="url(#brassGrad)"/>
    
    <!-- Recessed Deep Forest Enamel -->
    <circle cx="0" cy="0" r="95" fill="#0D2619"/>

    <!-- Inner Brass Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="url(#brassGrad)" stroke-width="2.5"/>

    <!-- Central SUTRA Emblem In Brass & Enamel -->
    <g transform="translate(0, -32) scale(1.1)">
      <circle cx="0" cy="0" r="22" fill="none" stroke="url(#brassGrad)" stroke-width="2.5"/>
      <path d="M 0,-16 L 4,-4 L 16,0 L 4,4 L 0,16 L -4,4 L -16,0 L -4,-4 Z" fill="url(#brassGrad)"/>
    </g>

    <!-- Bold Hard-Enamel SUTRA Title -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="30" fill="url(#brassGrad)" letter-spacing="6" text-anchor="middle">SUTRA</text>
    
    <!-- Accent Dot -->
    <circle cx="68" cy="18" r="4.5" fill="#A3E635"/>

    <!-- Enamel Badge Subtitle -->
    <text x="0" y="48" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#E4EDE3" letter-spacing="4" text-anchor="middle">STUDENT EXCELLENCE</text>
    <text x="0" y="64" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" fill="#8FAF91" letter-spacing="2.5" text-anchor="middle">OFFICIAL PIN • 2026</text>
  </g>
</svg>
