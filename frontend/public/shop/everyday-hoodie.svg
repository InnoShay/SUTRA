<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="hoodieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#194231"/>
      <stop offset="50%" stop-color="#123325"/>
      <stop offset="100%" stop-color="#0A2218"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#071b12" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="655" rx="230" ry="34" fill="url(#shadow)"/>

  <!-- Hoodie Body -->
  <g filter="url(#subtleDrop)">
    <!-- Hood Profile behind -->
    <path d="M 210,130 C 210,65 390,65 390,130 Z" fill="#0C2419"/>
    <path d="M 230,135 C 230,90 370,90 370,135 Z" fill="#143627"/>

    <!-- Sleeves and Torso -->
    <path d="M 200,140 L 400,140 L 515,220 L 460,360 L 405,300 L 410,610 Q 300,625 190,610 L 195,300 L 140,360 L 85,220 Z" fill="url(#hoodieGrad)"/>
    
    <!-- Ribbed Cuffs and Hem -->
    <path d="M 190,585 L 410,585 L 410,612 Q 300,625 190,612 Z" fill="#0E281D"/>
    
    <!-- Kangaroo Pocket -->
    <path d="M 230,440 L 370,440 L 390,560 L 210,560 Z" fill="#0E291E" stroke="#1C4B37" stroke-width="1.5"/>
    <!-- Pocket Side Slits -->
    <path d="M 230,440 L 210,500 L 210,560" stroke="#1D4A37" stroke-width="2" fill="none"/>
    <path d="M 370,440 L 390,500 L 390,560" stroke="#1D4A37" stroke-width="2" fill="none"/>

    <!-- Hood Drawstrings -->
    <path d="M 260,165 Q 265,260 255,290" stroke="#8FAF91" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="255" cy="292" r="3" fill="#DCE3D9"/>
    <path d="M 340,165 Q 335,260 345,290" stroke="#8FAF91" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="345" cy="292" r="3" fill="#DCE3D9"/>
  </g>

  <!-- PROMINENT SUTRA CHEST LETTERING -->
  <g transform="translate(300, 270)">
    <!-- Arch SUTRA Title -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="8" text-anchor="middle">SUTRA</text>
    
    <!-- Accent Dot -->
    <circle cx="98" cy="-5" r="5" fill="#A3E635"/>

    <!-- University Subtitle -->
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#8FAF91" letter-spacing="5" text-anchor="middle">ATHLETICS &amp; ACADEMICS</text>
    
    <!-- Est badge -->
    <text x="0" y="44" font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="rgba(255,255,255,0.7)" letter-spacing="3" text-anchor="middle">EST. 2026 • 420 GSM FRENCH TERRY</text>
  </g>

  <!-- Left Wrist Micro-Embroidered Crest -->
  <g transform="translate(470, 330)">
    <circle cx="0" cy="0" r="10" fill="#0A1E14" stroke="#A3E635" stroke-width="1.5"/>
    <text x="0" y="3.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle">S</text>
  </g>
</svg>
