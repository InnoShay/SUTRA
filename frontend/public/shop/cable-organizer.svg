<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="leatherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BD743E"/>
      <stop offset="50%" stop-color="#9C5928"/>
      <stop offset="100%" stop-color="#733B14"/>
    </linearGradient>
    <linearGradient id="brassSnap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="leatherDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="18" stdDeviation="20" flood-color="#0a1f15" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="630" rx="190" ry="28" fill="url(#shadow)"/>

  <!-- Wrapped Cable Bundle Coiled Behind -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#2D3748" stroke-width="26" opacity="0.35"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#E2E8F0" stroke-width="22"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#CBD5E1" stroke-width="20"/>
  </g>

  <!-- Full Grain Leather Taco Strap Enclosing Cables -->
  <g transform="translate(300, 360)" filter="url(#leatherDrop)">
    <!-- Folded Leather Body -->
    <rect x="-140" y="-120" width="280" height="240" rx="40" fill="url(#leatherGrad)" stroke="#683410" stroke-width="2"/>
    
    <!-- Edge Burnish Stitching -->
    <rect x="-124" y="-104" width="248" height="208" rx="30" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- PROMINENT DEBOSSED SUTRA BRANDING -->
    <g transform="translate(0, -30)">
      <circle cx="0" cy="-20" r="22" fill="#5E2C0C" stroke="#3D1C06" stroke-width="1.5"/>
      <path d="M 0,-14 L 3,-4 L 12,0 L 3,4 L 0,14 L -3,4 L -12,0 L -3,-4 Z" fill="#D97706"/>
      <text x="0" y="24" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="28" fill="#421C06" letter-spacing="4" text-anchor="middle">SUTRA</text>
      <circle cx="62" cy="20" r="3.5" fill="#A3E635"/>
      <text x="0" y="44" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#753C14" letter-spacing="2.5" text-anchor="middle">LEATHER PROVISIONS</text>
    </g>

    <!-- Heavy-Duty Antique Brass Snap Fastener -->
    <g transform="translate(0, 55)">
      <circle cx="0" cy="0" r="28" fill="url(#brassSnap)" stroke="#78350F" stroke-width="2"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#FDE68A" stroke-width="1.5"/>
      <!-- SUTRA engraved around the rim of the snap -->
      <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" fill="#451A03" letter-spacing="2" text-anchor="middle">SUTRA</text>
    </g>
  </g>
</svg>
