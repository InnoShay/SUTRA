<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="feltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D4D3D"/>
      <stop offset="50%" stop-color="#223D30"/>
      <stop offset="100%" stop-color="#182E24"/>
    </linearGradient>
    <filter id="matDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0a1f15" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="650" rx="230" ry="32" fill="url(#shadow)"/>

  <!-- Cork Underlayer Edge -->
  <g filter="url(#matDrop)">
    <rect x="75" y="155" width="450" height="440" rx="24" fill="#C49A6C"/>
    
    <!-- Main Merino Wool Felt Mat -->
    <rect x="70" y="150" width="450" height="440" rx="22" fill="url(#feltGrad)" stroke="#39614E" stroke-width="2"/>

    <!-- Subtle Beveled Precision Edge Stitching -->
    <rect x="82" y="162" width="426" height="416" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Felt Texture Speckling -->
    <circle cx="200" cy="300" r="1.5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="350" cy="220" r="1.5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="420" cy="400" r="1.5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="150" cy="480" r="1.5" fill="rgba(255,255,255,0.15)"/>
    <circle cx="280" cy="510" r="1.5" fill="rgba(255,255,255,0.15)"/>

    <!-- Top Right: Minimal Phone/Pen Notch -->
    <rect x="350" y="180" width="130" height="8" rx="4" fill="#142B20"/>

    <!-- BOTTOM RIGHT: LEATHER CORNER BADGE WITH PROMINENT SUTRA STAMP -->
    <g transform="translate(360, 480)">
      <rect x="0" y="0" width="140" height="90" rx="12" fill="#B47243" stroke="#8A4E24" stroke-width="1.5"/>
      <!-- Brass Rivets -->
      <circle cx="14" cy="14" r="3.5" fill="#FCD34D"/>
      <circle cx="126" cy="14" r="3.5" fill="#FCD34D"/>
      <circle cx="14" cy="76" r="3.5" fill="#FCD34D"/>
      <circle cx="126" cy="76" r="3.5" fill="#FCD34D"/>

      <!-- Embossed Brand Typography -->
      <text x="70" y="44" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="20" fill="#4A250E" letter-spacing="4" text-anchor="middle">SUTRA</text>
      <circle cx="112" cy="40" r="3" fill="#A3E635"/>
      <text x="70" y="60" font-family="'Inter', sans-serif" font-weight="700" font-size="7.5" fill="#6B3716" letter-spacing="2" text-anchor="middle">STUDIO DESK MAT</text>
    </g>

    <!-- Center Watermark Outline -->
    <g transform="translate(250, 370)" opacity="0.08">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">SUTRA</text>
    </g>
  </g>
</svg>
