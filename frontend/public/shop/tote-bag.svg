<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="canvasEcru" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F0"/>
      <stop offset="50%" stop-color="#F2EDE0"/>
      <stop offset="100%" stop-color="#E5DCShort"/>
    </linearGradient>
    <filter id="toteDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#071b12" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="650" rx="220" ry="32" fill="url(#shadow)"/>

  <!-- Handles -->
  <g fill="none" stroke="#153D30" stroke-width="22" stroke-linecap="round">
    <path d="M 220,300 C 220,100 240,60 300,60 C 360,60 380,100 380,300"/>
  </g>
  <!-- Handle Texture Ribbing -->
  <g fill="none" stroke="#245640" stroke-width="16" stroke-linecap="round">
    <path d="M 220,300 C 220,100 240,60 300,60 C 360,60 380,100 380,300"/>
  </g>

  <!-- Tote Body -->
  <g filter="url(#toteDrop)">
    <path d="M 120,280 L 480,280 L 450,620 Q 300,635 150,620 Z" fill="#F4EFE2" stroke="#DFD7C4" stroke-width="2"/>
    
    <!-- Top Fold Hem -->
    <rect x="120" y="280" width="360" height="30" fill="#EAE3D2" stroke="#D3C9B0" stroke-width="1"/>
    
    <!-- Handle Box Stitching on Bag -->
    <rect x="208" y="275" width="24" height="40" fill="#153D30" rx="3"/>
    <rect x="368" y="275" width="24" height="40" fill="#153D30" rx="3"/>

    <!-- Natural Canvas Grain / Wrinkle Lines -->
    <path d="M 150,330 Q 180,480 160,610" stroke="rgba(0,0,0,0.06)" stroke-width="2" fill="none"/>
    <path d="M 450,330 Q 420,480 440,610" stroke="rgba(0,0,0,0.06)" stroke-width="2" fill="none"/>

    <!-- PROMINENT SUTRA SUPPLY SCREENPRINT -->
    <g transform="translate(300, 440)">
      <!-- Graphic Frame / Stamp -->
      <rect x="-110" y="-85" width="220" height="170" rx="14" fill="none" stroke="#153D30" stroke-width="2.5"/>
      <rect x="-102" y="-77" width="204" height="154" rx="10" fill="none" stroke="#153D30" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- University Arch Laurel Emblem -->
      <g transform="translate(0, -42) scale(0.8)">
        <circle cx="0" cy="0" r="22" fill="#153D30"/>
        <path d="M 0,-14 L 3,-4 L 14,0 L 3,4 L 0,14 L -3,4 L -14,0 L -3,-4 Z" fill="#A3E635"/>
      </g>

      <!-- Bold SUTRA Lettering -->
      <text x="0" y="6" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="36" fill="#153D30" letter-spacing="6" text-anchor="middle">SUTRA</text>
      
      <!-- Accent Dot -->
      <circle cx="82" cy="0" r="4.5" fill="#A3E635"/>

      <!-- Supporting Subtitle -->
      <text x="0" y="30" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#245640" letter-spacing="4" text-anchor="middle">SUPPLY CO.</text>
      
      <text x="0" y="52" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#667168" letter-spacing="2.5" text-anchor="middle">EARNED, NOT BOUGHT • 16 OZ CANVAS</text>
    </g>

    <!-- Bottom Corner Woven Label -->
    <g transform="translate(145, 600)">
      <rect x="0" y="0" width="30" height="18" fill="#153D30" rx="2"/>
      <text x="15" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="6.5" fill="#FFFFFF" text-anchor="middle">S</text>
    </g>
  </g>
</svg>
