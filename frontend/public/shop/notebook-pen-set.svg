<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6CEBE"/>
      <stop offset="100%" stop-color="#BFB5A2"/>
    </linearGradient>
    <filter id="setDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="10" dy="20" stdDeviation="24" flood-color="#0a1f15" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="650" rx="220" ry="32" fill="url(#shadow)"/>

  <!-- Presentation Rigid Box -->
  <g filter="url(#setDrop)">
    <rect x="90" y="110" width="420" height="500" rx="16" fill="url(#boxGrad)" stroke="#B3A894" stroke-width="2"/>
    <rect x="105" y="125" width="390" height="470" rx="12" fill="#2A2F2C"/>

    <!-- Left Compartment: Focus Notebook -->
    <g transform="translate(130, 145)">
      <rect x="0" y="0" width="220" height="430" rx="6" fill="#153D30" stroke="#245A42" stroke-width="1.5"/>
      <!-- Foil Deboss on Book -->
      <g transform="translate(110, 215)">
        <circle cx="0" cy="-30" r="18" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
        <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FBBF24" letter-spacing="4" text-anchor="middle">SUTRA</text>
        <circle cx="48" cy="7" r="3" fill="#A3E635"/>
        <text x="0" y="28" font-family="'Inter', sans-serif" font-weight="600" font-size="8" fill="#8FAF91" letter-spacing="2" text-anchor="middle">JOURNAL</text>
      </g>
    </g>

    <!-- Right Compartment: Machined Pen in Foam Cradle -->
    <g transform="translate(390, 145)">
      <rect x="0" y="0" width="75" height="430" rx="6" fill="#1C211E"/>
      <!-- Precision Pen -->
      <g transform="translate(37, 215)">
        <rect x="-8" y="-170" width="16" height="340" rx="3" fill="#1E4735" stroke="#F59E0B" stroke-width="1"/>
        <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="3" text-anchor="middle" transform="rotate(90)">SUTRA</text>
      </g>
    </g>
  </g>

  <!-- Branded Keepsake Sleeve Bellyband -->
  <g transform="translate(90, 360)">
    <rect x="0" y="-35" width="420" height="70" fill="#153D30" opacity="0.95"/>
    <text x="210" y="4" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">SUTRA SUPPLY</text>
    <text x="210" y="20" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#A3E635" letter-spacing="3" text-anchor="middle">STUDENT DESK EDITION • BUNDLE</text>
  </g>
</svg>
