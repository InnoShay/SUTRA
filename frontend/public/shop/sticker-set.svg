<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F9F5"/>
      <stop offset="100%" stop-color="#E8ECE2"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,35,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(15,35,25,0)"/>
    </radialGradient>
    <filter id="stickerDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="12" stdDeviation="14" flood-color="#071b12" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <ellipse cx="300" cy="650" rx="220" ry="32" fill="url(#shadow)"/>

  <!-- Sticker 1: Big Dark Forest Oval (Top Left) -->
  <g transform="translate(230, 240) rotate(-10)" filter="url(#stickerDrop)">
    <rect x="-140" y="-60" width="280" height="120" rx="36" fill="#FFFFFF"/>
    <rect x="-132" y="-52" width="264" height="104" rx="28" fill="#153D30"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="6" text-anchor="middle">SUTRA</text>
    <circle cx="82" cy="0" r="5" fill="#A3E635"/>
    <text x="0" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#8FAF91" letter-spacing="3" text-anchor="middle">OFFICIAL SUPPLY CO.</text>
  </g>

  <!-- Sticker 2: Round Crest (Top Right) -->
  <g transform="translate(420, 260) rotate(12)" filter="url(#stickerDrop)">
    <circle cx="0" cy="0" r="88" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="80" fill="#245640"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#A3E635" stroke-width="2" stroke-dasharray="4 3"/>
    
    <!-- Central Icon -->
    <path d="M 0,-36 L 6,-12 L 32,0 L 6,12 L 0,36 L -6,12 L -32,0 L -6,-12 Z" fill="#A3E635"/>
    <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">SUTRA</text>
  </g>

  <!-- Sticker 3: "EARNED NOT BOUGHT" Banner (Center) -->
  <g transform="translate(300, 410) rotate(-4)" filter="url(#stickerDrop)">
    <rect x="-170" y="-45" width="340" height="90" rx="16" fill="#FFFFFF"/>
    <rect x="-162" y="-37" width="324" height="74" rx="12" fill="#0E2319"/>
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#A3E635" letter-spacing="4" text-anchor="middle">EARNED, NOT BOUGHT</text>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#E4EDE3" letter-spacing="3" text-anchor="middle">STUDENT SUCCESS ENGINE • SUTRA</text>
  </g>

  <!-- Sticker 4: Lime Hexagon (Bottom Left) -->
  <g transform="translate(200, 530) rotate(8)" filter="url(#stickerDrop)">
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#FFFFFF"/>
    <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34" fill="#A3E635"/>
    <text x="0" y="-10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#153D30" letter-spacing="2" text-anchor="middle">VERIFIED</text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#153D30" letter-spacing="2" text-anchor="middle">SUTRA</text>
    <text x="0" y="36" font-family="'Inter', sans-serif" font-weight="700" font-size="8" fill="#153D30" letter-spacing="1" text-anchor="middle">MERIT</text>
  </g>

  <!-- Sticker 5: Clean Holographic Bar (Bottom Right) -->
  <g transform="translate(400, 540) rotate(-6)" filter="url(#stickerDrop)">
    <rect x="-110" y="-40" width="220" height="80" rx="14" fill="#FFFFFF"/>
    <rect x="-103" y="-33" width="206" height="66" rx="10" fill="#1F4735"/>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="5" text-anchor="middle">SUTRA.</text>
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="600" font-size="7" fill="#8FAF91" letter-spacing="2" text-anchor="middle">WEATHERPROOF VINYL</text>
  </g>
</svg>
