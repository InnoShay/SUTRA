experiment:
  name: "sutra_phase3_day30_benchmark"
  random_seed: 42
  prediction_cutoff_days: 30

data:
  dataset_path: "data/processed/day30_features.csv"
  train_presentations:
    - "2013B"
    - "2013J"
    - "2014B"
  test_presentation: "2014J"
  target_column: "target"
  group_column: "id_student"
  id_columns:
    - "code_module"
    - "code_presentation"
    - "id_student"
  metadata_columns:
    - "target_name"
    - "raw_final_result"

cv:
  strategy: "GroupKFold"
  n_splits: 5

features:
  numerical:
    - "num_of_prev_attempts"
    - "studied_credits"
    - "days_registered_before_start"
    - "has_missing_registration_date"
    - "vle_total_clicks_d30"
    - "vle_active_days_d30"
    - "vle_clicks_precourse"
    - "vle_clicks_poststart_d30"
    - "vle_clicks_last_7d"
    - "vle_days_since_last_click"
    - "vle_clicks_forumng_d30"
    - "vle_clicks_oucontent_d30"
    - "vle_clicks_quiz_d30"
    - "vle_clicks_homepage_d30"
    - "vle_clicks_other_d30"
    - "has_vle_activity_d30"
    - "assessments_submitted_d30"
    - "assessment_banked_d30"
    - "has_early_assessment_submission_d30"
  categorical:
    - "gender"
    - "region"
    - "highest_education"
    - "imd_band"
    - "age_band"
    - "disability"

baseline_logistic_regression:
  model_type: "LogisticRegression"
  penalty: "l2"
  C: 1.0
  solver: "lbfgs"
  max_iter: 1000
  class_weight: "balanced"
  random_state: 42

candidate_xgboost:
  model_type: "XGBClassifier"
  n_estimators: 150
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  eval_metric: "logloss"
  scale_pos_weight: 1.2
  random_state: 42

evaluation:
  default_threshold: 0.50
  target_recall_for_intervention: 0.70
  metrics_output: "reports/metrics/model_comparison.json"
  evaluation_report: "reports/model_evaluation_report.md"
  artifact_dir: "artifacts/models/v1.0.0"
